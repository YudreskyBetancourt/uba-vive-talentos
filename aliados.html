<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Empresas Aliadas - UBA Vive Talentos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --azul-marino: #001F4D; --dorado: #C99A2E; }
        body { font-family: sans-serif; display: flex; background: #F5F7FA; }
        .sidebar { width: 260px; background-color: var(--azul-marino); height: 100vh; position: fixed; padding: 20px; color: white; }
        .main-content { margin-left: 260px; width: 100%; padding: 30px; }
        /* Dropdown */
        .user-profile-container { position: relative; cursor: pointer; }
        .dropdown-menu { display: none; position: absolute; right: 0; background: white; width: 220px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 10px; z-index: 1000; }
        .dropdown-menu.show { display: block; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <nav>
            <a href="index.html" style="color:white; text-decoration:none;">Inicio</a><br>
            <a href="aliados.html" style="color:var(--dorado); text-decoration:none;">Empresas Aliadas</a>
        </nav>
    </aside>
    <main class="main-content">
        <header style="display: flex; justify-content: flex-end;">
            <div class="user-profile-container" onclick="document.getElementById('userDropdown').classList.toggle('show')">
                <div style="background:white; padding:10px 20px; border-radius:30px;">Yudresky P. <i class="fa-solid fa-angle-down"></i></div>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="perfil.html">Mi Perfil</a>
                    <a href="index.html" style="color:red;">Cerrar Sesión</a>
                </div>
            </div>
        </header>
        <h1>Empresas Aliadas</h1>
    </main>
    <script>
        window.onclick = function(event) {
            if (!event.target.matches('.user-profile-container') && !event.target.matches('.fa-angle-down')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) { dropdowns[i].classList.remove('show'); }
            }
        }
    </script>
</body>
</html>
