        }

            border-radius: 50%;

            justify-content: center;
            align-items: center;
            font-size: 60px;

            border: 1px solid rgba(255,255,255,0.2);

        .p-stat-box h3 { color: var(--blanco); font-size: 18px; margin-bottom: 2px; }
        .p-stat-box p { font-size: 10px; opacity: 0.8; }

        }
