<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - UBA Vive Talentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --azul-rey: #003B8E; --azul-marino: #001F4D; --dorado: #C99A2E; --blanco: #FFFFFF; --gris-fondo: #F5F7FA; --gris-texto: #4A4A4A; --gris-claro: #E0E5EC; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--gris-fondo); display: flex; }
        .sidebar { width: 260px; background-color: var(--azul-marino); color: var(--blanco); height: 100vh; position: fixed; padding: 20px; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-menu a { display: flex; align-items: center; gap: 15px; padding: 12px 20px; color: var(--blanco); font-weight: 600; border-radius: 8px; text-decoration: none; }
        .nav-menu a.activo { background-color: var(--dorado); color: var(--azul-marino); }
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 30px 50px; }

        /* Estilos del Dropdown (Idénticos al perfil) */
        .topbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 30px; }
        .user-profile-container { position: relative; cursor: pointer; }
        .user-profile-mini { display: flex; align-items: center; gap: 10px; background: white; padding: 8px 15px; border-radius: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 110%; background: white; width: 220px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); padding: 10px 0; z-index: 1000; border: 1px solid var(--gris-claro); }
        .dropdown-menu.show { display: block; }
        .dropdown-menu a { display: block; padding: 10px 20px; color: var(--gris-texto); text-decoration: none; font-size: 14px; }
        .dropdown-menu a:hover { background-color: var(--gris-fondo); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>UBA <span>ViveTalentos</span></h2>
        <nav class="nav-menu">
            <a href="index.html" class="activo">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="retos.html">Simulacros y Retos</a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div class="user-profile-container" onclick="toggleMenu()">
                <div class="user-profile-mini">
                    <i class="fa-solid fa-circle-user" style="font-size: 25px; color: var(--azul-rey);"></i>
                    <span>Yudresky P. <i class="fa-solid fa-angle-down"></i></span>
                </div>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="perfil.html">Editar Perfil</a>
                    <a href="vacantes.html">Ver Vacantes</a>
                    <div style="border-top:1px solid #eee; margin:5px 0;"></div>
                    <a href="index.html" style="color:red;">Cerrar Sesión</a>
                </div>
            </div>
        </header>
        <h1>Bienvenida de nuevo</h1>
    </main>
    <script>
        function toggleMenu() { document.getElementById("userDropdown").classList.toggle("show"); }
        window.onclick = function(event) {
            if (!event.target.matches('.user-profile-container') && !event.target.matches('.fa-angle-down')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) { dropdowns[i].classList.remove('show'); }
            }
        }
    </script>
</body>
</html>
